
# verify_jwt declarado explicitamente: esta função publica comentários em
# tickets reais assinados pelo perfil da Qualidade. Ela também confere o papel
# do chamador internamente (ver index.ts), mas exigir o JWT na borda impede que
# qualquer requisição anônima sequer alcance esse código.
[functions.helpdesk-publish-evaluation]
enabled = true
verify_jwt = true
entrypoint = "./functions/helpdesk-publish-evaluation/index.ts"

[functions.admin-create-user]
enabled = true
verify_jwt = true
import_map = "./functions/admin-create-user/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/admin-create-user/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/admin-create-user/*.html" ]

[functions.admin-invite-user]
enabled = true
verify_jwt = true
import_map = "./functions/admin-invite-user/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/admin-invite-user/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/admin-invite-user/*.html" ]

[functions.admin-update-user-email]
enabled = true
verify_jwt = true
import_map = "./functions/admin-update-user-email/deno.json"
entrypoint = "./functions/admin-update-user-email/index.ts"
