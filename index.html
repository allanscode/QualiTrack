<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Security policies are delivered as HTTP headers by Vercel/Vite/Nginx.
         A second CSP here intersects with those policies and can block CAPTCHA. -->

    <!-- Primary Meta Tags -->
    <title>QualidadeWP - Gestão de Qualidade para Suporte</title>
    <meta name="title" content="QualidadeWP - Gestão de Qualidade para Suporte" />
    <meta name="description" content="Sistema de gestão de qualidade para operações de suporte ao cliente. Monitorias estruturadas, fluxo de contestação, dashboards analíticos e prazos automatizados." />
    <meta name="keywords" content="gestão de qualidade, monitoria, suporte ao cliente, dashboard, contestação, SLA, CSAT" />
    <meta name="author" content="QualidadeWP Team" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0A1F44" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="QualidadeWP - Gestão de Qualidade para Suporte" />
    <meta property="og:description" content="Sistema completo de gestão de qualidade para operações de suporte. Monitorias estruturadas, fluxo de contestação automatizado, dashboards por perfil e SLA inteligente." />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="QualidadeWP" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QualidadeWP - Gestão de Qualidade para Suporte" />
    <meta name="twitter:description" content="Sistema completo de gestão de qualidade para operações de suporte. Monitorias, contestações, dashboards e SLA." />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://*.supabase.co" />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://*.supabase.co" />

    <script>
      (function(){var t=localStorage.getItem('qualitrack_theme');var d=false;
      if(t==='dark'){d=true}else if(t==='system'||!t){d=window.matchMedia('(prefers-color-scheme:dark)').matches}
      if(d){document.documentElement.classList.add('dark');document.documentElement.style.colorScheme='dark'}
      else{document.documentElement.classList.remove('dark');document.documentElement.style.colorScheme='light'}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
