services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        - VITE_SUPABASE_URL
        - VITE_SUPABASE_ANON_KEY
    container_name: qualitrack-app
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - qualitrack-network
    volumes:
      - qualitrack-logs:/var/log/nginx
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=qualitrack-network"
      - "traefik.http.routers.qualitrack.rule=Host(`qualitrack.localhost`)"
      - "traefik.http.routers.qualitrack.entrypoints=web"
      - "traefik.http.services.qualitrack.loadbalancer.server.port=8080"
      - "traefik.http.routers.qualitrack.middlewares=qualitrack-headers"
      - "traefik.http.middlewares.qualitrack-headers.headers.customrequestheaders.X-Forwarded-Proto=https"

  # Optional: Traefik reverse proxy for local development
  traefik:
    image: traefik:v3.0
    container_name: qualitrack-traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=admin@qualitrack.local"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"  # Traefik dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-letsencrypt:/letsencrypt"
    networks:
      - qualitrack-network
    labels:
      - "traefik.enable=true"
    restart: unless-stopped

networks:
  qualitrack-network:
    driver: bridge

volumes:
  qualitrack-network:
  qualitrack-logs:
  traefik-letsencrypt: